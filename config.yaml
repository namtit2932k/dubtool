# Defaults, overridable by CLI flags. Edit values, not keys.
llm_provider: gemini          # gemini | ollama | anthropic
whisper_model: small          # small | medium | large-v3 (large-v3 if GPU present)
device: cpu                   # cpu | cuda
chars_per_sec: 12.5  # AGENT_UPDATE_4 task A1, re-measured on TRIMMED clips (job test1-e5df32ffda, 82 segments, chars incl. spaces / trimmed tts_duration): p25 12.88, median 15.02, p75 17.31, min 7.81, max 20.36 -> p25 floored to 12.5. Old value 8.0 came from untrimmed clips (median 9.98, p25 8.03, ~0.94 s avg silence/clip).
max_stretch: 1.15
max_fit_attempts: 3
tts_voice: vi-VN-HoaiMyNeural # or vi-VN-NamMinhNeural

# edge-tts extras (AGENT_UPDATE_3 task 2). rate is the edge-tts speaking-rate
# parameter; a small positive rate (e.g. +5%) is an option if clips still
# overflow — the user decides, the default stays +0%.
tts_rate: "+0%"
tts_trim_silence: true  # measured: avg 1.148 s of lead+tail silence per clip (10-clip sample) -> trimming is on

tts_silence_threshold_db: -35  # silencedetect threshold used both for measuring and trimming
tts_silence_margin_s: 0.05     # keep ~0.05 s of margin so word on/endings are never cut

# Per-provider LLM settings. chunk_size is smaller for free/local models
# because they follow segment counts and length limits less reliably.
llm:
  # Key pool (AGENT_UPDATE_5.md 2.4, shared by app and CLI).
  key_cooldown_s: 60           # 429 cooldown per key unless the API gives a hint
  max_all_keys_wait_s: 600     # give up after this total wait when ALL keys are limited
  # AGENT_UPDATE_6.md task 5 (quota/budget).
  max_requests_per_run: 120    # base calls/run (scales up to 4x when multiple API keys are saved)
  request_timeout_s: 180       # per-request cap (Accurate mode); Fast mode: request_timeout_s_fast
  request_timeout_s_fast: 90   # AGU8 3.5: Fast mode gets a tighter cap
  # Update 12 task 2: the bounded capacity retry schedule (503/500/502 —
  # at most 4 attempts, never a split on these; jitter added).
  backoff_s:
    - 5
    - 15
    - 45
    - 90
  server_error_backoff_s:      # legacy name, kept for old configs
    - 10
    - 30
    - 90
  split_on_timeout: true       # 504/timeout/400-size split ONCE (503 never splits)
  split_min_units: 4           # a chunk must be larger than this to split
  split_min_chars: 600         # ...and larger than this many source chars
  # AGENT_UPDATE_11 2.1: request size caps (chars first, then unit count).
  chunk_max_chars: 1200        # a 16-unit/3827-char video becomes 3-4 requests
  chunk_max_units: 8
  breaker_failures: 3          # consecutive failed REQUESTS before the breaker opens
  breaker_cooldown_s: 60       # the open window; a half-open probe decides
  fallback_after_opens: 2      # breaker opens this many times -> Fast model
  max_rpm: null                # optional token bucket per model (requests/minute)
  overload_after: 2            # dialog cadence for the 'ask' policy
  overload_policy: fallback_fast  # ask | fallback_fast | wait (Settings -> General)
  stage_budget_s: 300          # stage wait budget on failing requests before the fallback
  shorten_fallback_mode: fast  # stage-5 shortening retries with the Fast model on daily quota
  gemini:
    model: gemini-3.5-flash-lite   # default: stable, free-of-charge tier (checked official docs 2026-10-25)
    chunk_size: 25
  ollama:
    host: http://localhost:11434
    model: gemma3:12b              # example: any multilingual model you have pulled
    chunk_size: 20
    timeout_sec: 300
  anthropic:
    model: claude-sonnet-5-5
    chunk_size: 40

# Audio mixing (stage 6): Vietnamese voice is laid on top of the lowered
# original audio. Later phases can swap the "original full mix" for a
# background-only track without touching the mixing code.
mix:
  mode: static           # static | duck
  original_gain_db: -14  # how much to lower the original audio
  dub_gain_db: 0
  duck:                  # sidechaincompress params, duck mode only
    threshold: 0.03
    ratio: 8
    attack_ms: 20
    release_ms: 400

# Translation (stage 3, AGENT_UPDATE_3 task 7): sentence-level by default.
translate:
  unit_mode: sentence    # sentence | segment (segment = previous behavior)
  budget_overshoot: 1.15 # enforcement pass triggers only above max_chars * this
  # AGENT_UPDATE_8 task 5.3: fidelity preset (the default is the Update 7 behavior).
  priority: balanced     # balanced | faithful | timing
  concurrency: 1         # parallel translation chunk calls (235AGU4 A3)
  pronouns:              # one pick per video, kept consistent (AGU4 A2)
    first: "tôi"
    second_plural: "các bạn"
    second_singular: "bạn"

# Sentence-unit grouping (stage 3)
units:
  max_segments: 4
  max_duration_s: 14
  max_gap_s: 1.0
  pause_split_s: 0.5     # AGU8 4.4: a pause this long closes the unit (unless a comma)

# ASR post-processing (stage 2)
asr:
  dedupe_min_words: 3            # shortest repeated run removed across a boundary
  condition_on_previous_text: false  # passed to faster-whisper for new transcriptions
  word_timestamps: true          # AGU8 4.2: word times -> words.json
  sentence_resegment: true       # AGU8 4.2: cut segments at sentence-final marks
  initial_prompt: ""             # optional faster-whisper initial_prompt (empty default)

# Playback schedule (stage 6/7, AGENT_UPDATE_3 task 3): clips never overlap.
schedule:
  gap_s: 0.08            # pause between adjacent Vietnamese clips
  max_shift_s: 2.0       # cap for delaying a clip; beyond -> overlap: true
# Update 12 task 2: the unit of dubbing — one clip per whole sentence.
dub:
  granularity: sentence        # sentence (default) | segment (old jobs resume)
# AGENT_UPDATE_8 task 1: TTS resilience.
tts:
  retry_rounds: 3              # deferred retry rounds after the first pass
  round_cooldown_s:            # cooldowns before each retry round
    - 15                       # AGU11 3.3: short cooldowns, the ladder replaces long waits
    - 30
    - 60
  request_timeout_s: 45        # AGU11 3.1: hard cap per edge-tts request
  attempt_delays_s:            # AGU11 3.3: waits between the repair-ladder steps
    - 1.5
    - 4
  direct_retries: 1            # quick same-voice retry for short segments before counting toward breaker
  max_chars_per_request: 200   # Update 12 task 3.3: split cap (one voice)
  alt_voice: vi-VN-NamMinhNeural  # DEPRECATED (Update 12: one voice per video) — ignored
  join_silence_s: 0.08         # silence between the split pieces, same voice
  unit_budget_s: 60            # one unit's first-pass budget
  stage_budget_s: 600          # budget for failing waits before the budget dialog
  budget_policy: stop          # headless: stop (default) | fallback_remaining | switch_all; the GUI shows the dialog
  concurrency: 2               # staggered edge-tts workers (drops to 1 automatically on throttling)
  max_rps: 1.5                 # conservative start pacing to avoid initial burst refusals
  limiter_floor_interval_s: 2.5 # slowest adaptive limiter interval on refusals
  breaker_consecutive: 6       # tolerate sporadic NoAudioReceived before pausing stage
  breaker_pause_s: 15
  breaker_pause_schedule_s:    # graduated breaker pauses instead of flat 60 s stalls
    - 10
    - 20
    - 30
  pacing_delay_s: 0.0          # extra per-call sleep when limiter is disabled
  max_delay_s: 2               # pacing delay cap
  max_cooldown_s: 120          # provider cooldown cap (was 30)
  fallback: none               # none | windows_winrt | windows_sapi | piper (AGU8 2.3)
  piper_voice: ""              # path of the voice model when fallback: piper

# AGENT_UPDATE_8 task 3.3: LLM punctuation restoration for the transcript.
punctuate:
  enabled: auto               # auto | on | off
  window_segments: 40
  max_missing_ratio: 0.30     # trigger when more than this share lacks final punctuation
  max_unpunct_run: 25         # trigger when a word run this long has no sentence-final mark

# AGENT_UPDATE_8 task 4: filler/vocative tagging.
fillers:
  ask: true                    # GUI shows the suggestions dialog when set; CLI never asks
  pause_s: 0.25

# AGENT_UPDATE_8 task 5.2: (cần kiểm tra) markers in the customer-readable file.
readable:
  mark_uncertain: false

# Vietnamese subtitles (stage 7): soft .srt + optionally burned in.
subtitles:
  burn: true             # false = copy the video stream unchanged
  font: Arial            # Windows font with Vietnamese diacritics
  size_ratio: 24         # FontSize px = video_height / size_ratio (libass units auto-converted)
  margin_ratio: 18       # MarginV px = video_height / margin_ratio
  max_line_chars: 42     # cue text cap per line; portrait video defaults to 28
  crf: 18                # burn encode quality
  preset: medium
