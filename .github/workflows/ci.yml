name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Windows · Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure isolated build root
        shell: pwsh
        run: |
          $buildRoot = Join-Path $env:RUNNER_TEMP "dubtool-build"
          New-Item -ItemType Directory -Force -Path $buildRoot | Out-Null
          "DUBTOOL_BUILD_ROOT=$buildRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packaging/requirements-lock.txt

      - name: Install FFmpeg
        shell: pwsh
        run: choco install ffmpeg --no-progress

      - name: Install locked dependencies (Python 3.13)
        if: matrix.python-version == '3.13'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/requirements-lock.txt
          python -m pip install --no-deps vieneu==3.8.5
          python -m pip install -e . --no-deps

      - name: Install from pyproject.toml (Python 3.11 compatibility)
        if: matrix.python-version != '3.13'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui,dev]"
          python -m pip install --no-deps "vieneu>=3.8,<4"

      - name: Preflight & README link gates
        shell: pwsh
        run: |
          python scripts/preflight_gates.py
          python scripts/check_readme_links.py --allow-missing-index

      - name: Run offline test suite
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest tests -m "not packaged" -q --timeout=120 -rs

      - name: Runtime self-test, layout check & GUI smoke
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m dubtool.app.main --selftest
          python -m dubtool.app.main --layout-check
          python -m dubtool.app.main --gui-smoke

  package:
    name: Windows · Python 3.13 · Release Build Verify
    runs-on: windows-latest
    needs: test
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure isolated build root & vendor assets
        shell: pwsh
        run: |
          $buildRoot = Join-Path $env:RUNNER_TEMP "dubtool-build"
          $vendorDir = Join-Path $buildRoot "vendor"
          $fontsDir  = Join-Path $vendorDir "fonts"
          New-Item -ItemType Directory -Force -Path $fontsDir | Out-Null
          "DUBTOOL_BUILD_ROOT=$buildRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install FFmpeg and populate vendor directory
        shell: pwsh
        run: |
          choco install ffmpeg --no-progress
          # Resolve the real Chocolatey ffmpeg.exe binary (not the 5 KB shim in bin/).
          $ffmpegPath = $null
          if (Test-Path "C:\ProgramData\chocolatey\lib\ffmpeg") {
            $ffmpegPath = Get-ChildItem "C:\ProgramData\chocolatey\lib\ffmpeg" -Recurse -Filter "ffmpeg.exe" |
              Sort-Object Length -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $ffmpegPath) { $ffmpegPath = (Get-Command ffmpeg).Source }
          Write-Host "Using real ffmpeg binary: $ffmpegPath ($((Get-Item $ffmpegPath).Length) bytes)"
          $vendorDir  = Join-Path $env:DUBTOOL_BUILD_ROOT "vendor"
          $fontsDir   = Join-Path $vendorDir "fonts"
          Copy-Item $ffmpegPath (Join-Path $vendorDir "ffmpeg.exe") -Force

          # Fetch the authentic SIL OFL-1.1 Noto Sans variable font and license
          # from the pinned google/fonts commit and verify SHA-256 (matching
          # packaging/THIRD_PARTY.md — never substitute a system font).
          $fontCommit = "2984c575fdce412ee02b2baaba67672b9a9434d8"
          $fontAssets = @(
            @{
              Url = "https://raw.githubusercontent.com/google/fonts/$fontCommit/ofl/notosans/NotoSans%5Bwdth,wght%5D.ttf"
              Dest = Join-Path $fontsDir "NotoSans.ttf"
              Sha256 = "bfb7bb691513f12e734dc346c03a03f784912432d7e3fa8e56efcf906fe86b3d"
            },
            @{
              Url = "https://raw.githubusercontent.com/google/fonts/$fontCommit/ofl/notosans/OFL.txt"
              Dest = Join-Path $fontsDir "OFL.txt"
              Sha256 = "cee9892f9f0cc8fe882c9e9537ee6a89621d86ee7ceaf70b02e2b2b1c25c061a"
            }
          )
          foreach ($asset in $fontAssets) {
            $ok = $false
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                Invoke-WebRequest -Uri $asset.Url -OutFile $asset.Dest -UseBasicParsing -TimeoutSec 60
                $ok = $true
                break
              } catch {
                Write-Warning "Attempt $attempt failed for $($asset.Url): $_"
                if ($attempt -lt 3) { Start-Sleep -Seconds (3 * $attempt) }
              }
            }
            if (-not $ok) { throw "Failed to download required font asset: $($asset.Url)" }
            $actual = (Get-FileHash -Path $asset.Dest -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $asset.Sha256) {
              throw "SHA-256 mismatch for $($asset.Dest): expected $($asset.Sha256), got $actual"
            }
            Write-Host "Verified $(Split-Path -Leaf $asset.Dest): $((Get-Item $asset.Dest).Length) bytes, sha256=$actual"
          }

      - name: Build release package via packaging/build_exe.ps1 from clean git archive
        shell: pwsh
        run: |
          # Mirror scripts/release.py: extract a clean .git-less source archive from HEAD
          # and run packaging/build_exe.ps1 directly (no publish/tag/release).
          $head = (git rev-parse HEAD).Trim()
          $relSrc = Join-Path $env:RUNNER_TEMP "dubtool-release-src"
          $tarFile = Join-Path $env:RUNNER_TEMP "dubtool-release-src.tar"
          if (Test-Path $relSrc) { Remove-Item -Recurse -Force $relSrc }
          New-Item -ItemType Directory -Force -Path $relSrc | Out-Null
          git archive --format=tar -o $tarFile HEAD
          if ($LASTEXITCODE -ne 0) { throw "git archive HEAD failed" }
          tar -xf $tarFile -C $relSrc
          if ($LASTEXITCODE -ne 0) { throw "tar extract failed" }
          Remove-Item -Force $tarFile

          $env:DUBTOOL_GIT_HEAD = $head
          $env:DUBTOOL_PYTHON = (Get-Command python).Source
          # Offline test suite already passed in both matrix jobs (-SkipTests),
          # while screenshots + test_screenshots.py + README link checks run live here.
          powershell -NoProfile -ExecutionPolicy Bypass -File (Join-Path $relSrc "packaging\build_exe.ps1") -SkipTests -KeepBuild
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify release artifacts (ZIP, SHA256SUMS, BUILD_INFO, --version, --selftest, --layout-check, --gui-smoke)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "
          import hashlib, os, subprocess, sys
          from pathlib import Path

          build_root = Path(os.environ['DUBTOOL_BUILD_ROOT'])
          dist_dir = build_root / 'dist'
          app_dir = dist_dir / 'DubTool'
          exe = app_dir / 'DubTool.exe'
          assert exe.is_file(), f'missing {exe}'

          update_num = Path('packaging/update_number.txt').read_text(encoding='utf-8').strip()
          expected_ver = f'1.0.{update_num}'
          expected_head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()

          # 1. Verify BUILD_INFO.txt matches version, commit SHA, and DubTool.exe hash.
          binfo_path = app_dir / 'BUILD_INFO.txt'
          assert binfo_path.is_file(), f'missing {binfo_path}'
          binfo = {}
          for ln in binfo_path.read_text(encoding='utf-8-sig').splitlines():
              if ':' in ln:
                  k, v = ln.split(':', 1)
                  binfo[k.strip()] = v.strip()
          exe_sha = hashlib.sha256(exe.read_bytes()).hexdigest()
          assert binfo.get('version') == expected_ver, f'BUILD_INFO version mismatch: {binfo}'
          assert binfo.get('git') == expected_head, f'BUILD_INFO git mismatch: {binfo}'
          assert binfo.get('sha256') == exe_sha, f'BUILD_INFO exe sha256 mismatch: {binfo}'
          assert binfo.get('build id') == f'Update {update_num} ({expected_head})', f'BUILD_INFO build id mismatch: {binfo}'
          bid = binfo.get('build id')
          print(f'Verified BUILD_INFO.txt: {bid}', flush=True)

          # 2. Verify ZIP and SHA256SUMS.txt consistency.
          zip_name = f'DubTool-{expected_ver}-win64.zip'
          zip_path = dist_dir / zip_name
          sums_path = dist_dir / 'SHA256SUMS.txt'
          assert zip_path.is_file(), f'missing {zip_path}'
          assert sums_path.is_file(), f'missing {sums_path}'
          zip_sha = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          sums_text = sums_path.read_text(encoding='utf-8-sig').strip()
          assert sums_text == f'{zip_sha}  {zip_name}', f'SHA256SUMS mismatch: {sums_text!r} vs {zip_sha}  {zip_name}'
          print(f'Verified {zip_name} ({zip_path.stat().st_size} bytes, sha256={zip_sha})', flush=True)

          # 3. Verify bundled authentic NotoSans.ttf and OFL.txt.
          font_path = app_dir / '_internal' / 'vendor' / 'fonts' / 'NotoSans.ttf'
          ofl_path = app_dir / '_internal' / 'vendor' / 'fonts' / 'OFL.txt'
          assert font_path.is_file() and ofl_path.is_file()
          font_sha = hashlib.sha256(font_path.read_bytes()).hexdigest()
          assert font_sha == 'bfb7bb691513f12e734dc346c03a03f784912432d7e3fa8e56efcf906fe86b3d', f'font sha mismatch: {font_sha}'

          # 4. Run packaged executable smoke gates.
          for flag in ('--version', '--selftest', '--layout-check', '--gui-smoke'):
              print(f'=== {exe} {flag} ===', flush=True)
              r = subprocess.run([str(exe), flag], capture_output=True, text=True, timeout=180)
              if r.stdout: print(r.stdout, flush=True)
              if r.stderr: print(r.stderr, file=sys.stderr, flush=True)
              if r.returncode != 0:
                  sys.exit(r.returncode)
              if flag == '--version':
                  assert expected_ver in r.stdout and expected_head in r.stdout, f'unexpected --version output: {r.stdout}'
          "

      - name: Upload packaged diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: packaged-build-diagnostics
          path: |
            ${{ env.DUBTOOL_BUILD_ROOT }}\screenshots
            ${{ env.DUBTOOL_BUILD_ROOT }}\dist\DubTool\BUILD_INFO.txt
            ${{ env.DUBTOOL_BUILD_ROOT }}\build\dubtool\warn-dubtool.txt
          if-no-files-found: ignore
