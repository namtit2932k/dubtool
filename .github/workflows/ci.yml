name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly drift check against windows-latest runner and Python 3.11 range deps
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Windows · Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure isolated build root
        shell: pwsh
        run: |
          $buildRoot = Join-Path $env:RUNNER_TEMP "dubtool-build"
          New-Item -ItemType Directory -Force -Path $buildRoot | Out-Null
          "DUBTOOL_BUILD_ROOT=$buildRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packaging/requirements-lock.txt

      - name: Fetch pinned FFmpeg (+ test-only ffprobe sidecar outside vendor/, SHA-256 verified)
        shell: pwsh
        run: |
          $ciToolsDir = Join-Path $env:RUNNER_TEMP "dubtool-ci-tools"
          python scripts/fetch_vendor.py --only ffmpeg --ci-sidecar-dir $ciToolsDir
          Join-Path $env:DUBTOOL_BUILD_ROOT "vendor" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $ciToolsDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install locked dependencies (Python 3.13 primary release env)
        if: matrix.python-version == '3.13'
        shell: pwsh
        run: |
          python -m pip install "pip==26.3"
          python -m pip install -r packaging/requirements-lock.txt
          python -m pip install --no-deps vieneu==3.8.5
          python -m pip install -e . --no-deps

      - name: Install from pyproject.toml (Python 3.11 compatibility drift check)
        if: matrix.python-version != '3.13'
        shell: pwsh
        run: |
          # Intentionally resolves latest compatible versions within pyproject.toml ranges
          # to surface upstream dependency drift on Python 3.11 early.
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui,dev]"
          python -m pip install --no-deps "vieneu>=3.8,<4"

      - name: Preflight & README link gates
        shell: pwsh
        run: |
          python scripts/preflight_gates.py
          python scripts/check_readme_links.py --allow-missing-index

      - name: Run offline test suite
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $junitPath = Join-Path $env:DUBTOOL_BUILD_ROOT "junit-py${{ matrix.python-version }}.xml"
          python -m pytest tests -m "not packaged" -q --timeout=120 -rs --junitxml=$junitPath

      - name: Runtime self-test, layout check & GUI smoke
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m dubtool.app.main --selftest
          python -m dubtool.app.main --layout-check
          python -m dubtool.app.main --gui-smoke

      - name: Capture pip freeze diagnostics on failure
        if: failure()
        continue-on-error: true
        shell: pwsh
        run: |
          $freezePath = Join-Path $env:DUBTOOL_BUILD_ROOT "pip-freeze-py${{ matrix.python-version }}.txt"
          python --version | Out-File -FilePath $freezePath -Encoding utf8
          python -m pip --version | Out-File -FilePath $freezePath -Encoding utf8 -Append
          python -m pip freeze | Out-File -FilePath $freezePath -Encoding utf8 -Append

      - name: Upload test diagnostics (JUnit XML & pip freeze) on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: test-diagnostics-py${{ matrix.python-version }}
          path: |
            ${{ env.DUBTOOL_BUILD_ROOT }}\junit-py${{ matrix.python-version }}.xml
            ${{ env.DUBTOOL_BUILD_ROOT }}\pip-freeze-py${{ matrix.python-version }}.txt
          if-no-files-found: ignore

  package:
    name: Windows · Python 3.13 · Release Build Verify
    runs-on: windows-latest
    needs: test
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure isolated build root & vendor assets
        shell: pwsh
        run: |
          $buildRoot = Join-Path $env:RUNNER_TEMP "dubtool-build"
          $vendorDir = Join-Path $buildRoot "vendor"
          $fontsDir  = Join-Path $vendorDir "fonts"
          New-Item -ItemType Directory -Force -Path $fontsDir | Out-Null
          "DUBTOOL_BUILD_ROOT=$buildRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Fetch pinned vendor assets (FFmpeg + NotoSans, SHA-256 verified)
        shell: pwsh
        run: |
          python scripts/fetch_vendor.py

      - name: Build release package via packaging/build_exe.ps1 from clean git archive
        shell: pwsh
        run: |
          # Mirror scripts/release.py: extract a clean .git-less source archive from HEAD
          # and run packaging/build_exe.ps1 directly (no publish/tag/release).
          $head = (git rev-parse HEAD).Trim()
          $relSrc = Join-Path $env:RUNNER_TEMP "dubtool-release-src"
          $tarFile = Join-Path $env:RUNNER_TEMP "dubtool-release-src.tar"
          if (Test-Path $relSrc) { Remove-Item -Recurse -Force $relSrc }
          New-Item -ItemType Directory -Force -Path $relSrc | Out-Null
          git archive --format=tar -o $tarFile HEAD
          if ($LASTEXITCODE -ne 0) { throw "git archive HEAD failed" }
          tar -xf $tarFile -C $relSrc
          if ($LASTEXITCODE -ne 0) { throw "tar extract failed" }
          Remove-Item -Force $tarFile

          $env:DUBTOOL_GIT_HEAD = $head
          $env:DUBTOOL_PYTHON = (Get-Command python).Source
          # Offline test suite already passed in both matrix jobs (-SkipTests).
          # Screenshots + test_screenshots.py run live on the packaged exe; only
          # -SkipReadmeImages skips overwriting throwaway rel_src/docs/images with
          # GitHub runner's default light-mode theme (README assets are verified in test jobs).
          powershell -NoProfile -ExecutionPolicy Bypass -File (Join-Path $relSrc "packaging\build_exe.ps1") -SkipTests -KeepBuild -SkipReadmeImages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify release ZIP integrity, provenance & extracted executable (--version, --selftest, --layout-check, --gui-smoke)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "
          import hashlib, json, os, subprocess, sys, tempfile, zipfile
          from pathlib import Path

          build_root = Path(os.environ['DUBTOOL_BUILD_ROOT'])
          dist_dir = build_root / 'dist'
          app_dir = dist_dir / 'DubTool'
          build_exe = app_dir / 'DubTool.exe'
          assert build_exe.is_file(), f'missing {build_exe}'

          update_num = Path('packaging/update_number.txt').read_text(encoding='utf-8').strip()
          expected_ver = f'1.0.{update_num}'
          expected_head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          expected_lock_sha = hashlib.sha256(Path('packaging/requirements-lock.txt').read_bytes()).hexdigest()
          expected_manifest_sha = hashlib.sha256(Path('packaging/vendor_manifest.json').read_bytes()).hexdigest()
          manifest = json.loads(Path('packaging/vendor_manifest.json').read_text(encoding='utf-8'))

          # 1. Verify ZIP hash vs SHA256SUMS.txt, CRC integrity (testzip), and required members.
          zip_name = f'DubTool-{expected_ver}-win64.zip'
          zip_path = dist_dir / zip_name
          sums_path = dist_dir / 'SHA256SUMS.txt'
          assert zip_path.is_file(), f'missing {zip_path}'
          assert sums_path.is_file(), f'missing {sums_path}'
          zip_sha = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          sums_text = sums_path.read_text(encoding='utf-8-sig').strip()
          assert sums_text == f'{zip_sha}  {zip_name}', f'SHA256SUMS mismatch: {sums_text!r} vs {zip_sha}  {zip_name}'
          print(f'Verified {zip_name} ({zip_path.stat().st_size} bytes, sha256={zip_sha})', flush=True)

          required_members = (
              'DubTool.exe',
              'BUILD_INFO.txt',
              '_internal/config.yaml',
              '_internal/vendor/ffmpeg.exe',
              '_internal/vendor/fonts/NotoSans.ttf',
              '_internal/vendor/fonts/OFL.txt',
              'THIRD_PARTY.md',
              'README_BUILD.md',
              'licenses/GPL-3.0.txt',
              'licenses/LGPL-3.0.txt',
              'licenses/OFL-NotoSans.txt',
              'licenses/THIRD_PARTY_NOTICES.txt',
          )
          with zipfile.ZipFile(zip_path, 'r') as zf:
              bad_member = zf.testzip()
              assert bad_member is None, f'corrupt ZIP member: {bad_member}'
              members = {n.replace(chr(92), '/') for n in zf.namelist()}
              missing = [m for m in required_members if m not in members]
              assert not missing, f'missing required ZIP members: {missing}'
              assert '_internal/vendor/ffprobe.exe' not in members, 'ffprobe.exe must NOT be inside the release ZIP'
              print(f'Verified ZIP CRC & structure ({len(members)} entries, no ffprobe.exe)', flush=True)

          # 2. Extract release ZIP into an isolated temp directory outside dist/DubTool and verify everything from it.
          with tempfile.TemporaryDirectory(prefix='dubtool-zip-verify-') as td:
              extract_dir = Path(td).resolve()
              with zipfile.ZipFile(zip_path, 'r') as zf:
                  zf.extractall(extract_dir)

              ext_exe = (extract_dir / 'DubTool.exe').resolve()
              assert ext_exe.is_file(), f'missing extracted {ext_exe}'
              assert ext_exe != build_exe.resolve(), 'smoke test must run from extracted ZIP, not dist/DubTool'
              assert dist_dir.resolve() not in ext_exe.parents, 'extracted ZIP dir must live outside dist/'

              # 2a. Verify BUILD_INFO.txt provenance inside the extracted ZIP.
              binfo_path = extract_dir / 'BUILD_INFO.txt'
              assert binfo_path.is_file(), f'missing extracted {binfo_path}'
              binfo = {}
              for ln in binfo_path.read_text(encoding='utf-8-sig').splitlines():
                  if ':' in ln:
                      k, v = ln.split(':', 1)
                      binfo[k.strip()] = v.strip()
              ext_exe_sha = hashlib.sha256(ext_exe.read_bytes()).hexdigest()
              assert binfo.get('version') == expected_ver, f'BUILD_INFO version mismatch: {binfo}'
              assert binfo.get('git') == expected_head, f'BUILD_INFO git mismatch: {binfo}'
              assert binfo.get('sha256') == ext_exe_sha, f'BUILD_INFO exe sha256 mismatch: {binfo}'
              assert binfo.get('build id') == f'Update {update_num} ({expected_head})', f'BUILD_INFO build id mismatch: {binfo}'
              py_meta = binfo.get('python', '')
              assert py_meta.startswith('3.13.') and '64-bit' in py_meta, f'unexpected BUILD_INFO python: {py_meta!r}'
              assert binfo.get('pip') == '26.3', f'unexpected BUILD_INFO pip: {binfo}'
              assert binfo.get('lockfile_sha256') == expected_lock_sha, f'BUILD_INFO lockfile_sha256 mismatch: {binfo}'
              assert binfo.get('vendor_manifest_sha256') == expected_manifest_sha, f'BUILD_INFO vendor_manifest_sha256 mismatch: {binfo}'
              assert binfo.get('ffmpeg_version') == manifest['assets']['ffmpeg']['version'], f'BUILD_INFO ffmpeg_version mismatch: {binfo}'
              assert binfo.get('ffmpeg_sha256') == manifest['assets']['ffmpeg']['sha256'].lower(), f'BUILD_INFO ffmpeg_sha256 mismatch: {binfo}'
              bid = binfo.get('build id')
              print(f'Verified extracted BUILD_INFO.txt provenance: {bid} | Python {py_meta} | pip 26.3', flush=True)

              # 2b. Verify all bundled vendor assets inside the extracted ZIP against vendor_manifest.json.
              for name, spec in manifest['assets'].items():
                  p = extract_dir / '_internal' / 'vendor' / spec['dest']
                  assert p.is_file(), f'missing extracted vendor asset {name}: {p}'
                  actual = hashlib.sha256(p.read_bytes()).hexdigest()
                  assert actual == spec['sha256'].lower(), f'extracted {name} sha mismatch: {actual}'
                  print(f'Verified extracted {name}: {p.stat().st_size} bytes, sha256={actual}', flush=True)

              # 2c. Run ALL 4 smoke gates directly from the extracted ZIP executable.
              for flag in ('--version', '--selftest', '--layout-check', '--gui-smoke'):
                  print(f'=== [extracted ZIP] {ext_exe} {flag} ===', flush=True)
                  r = subprocess.run([str(ext_exe), flag], cwd=extract_dir, capture_output=True, text=True, timeout=180)
                  if r.stdout: print(r.stdout, flush=True)
                  if r.stderr: print(r.stderr, file=sys.stderr, flush=True)
                  if r.returncode != 0:
                      sys.exit(r.returncode)
                  if flag == '--version':
                      assert expected_ver in r.stdout and expected_head in r.stdout, f'unexpected --version output: {r.stdout}'
              print('Verified extracted release ZIP executable (all 4 smoke gates): PASS', flush=True)
          "

      - name: Upload packaged diagnostics on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: packaged-build-diagnostics
          path: |
            ${{ env.DUBTOOL_BUILD_ROOT }}\screenshots
            ${{ env.DUBTOOL_BUILD_ROOT }}\dist\DubTool\BUILD_INFO.txt
            ${{ env.DUBTOOL_BUILD_ROOT }}\build\dubtool\warn-dubtool.txt
          if-no-files-found: ignore
