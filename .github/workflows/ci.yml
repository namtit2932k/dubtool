name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Windows · Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure isolated build root
        shell: pwsh
        run: |
          $buildRoot = Join-Path $env:RUNNER_TEMP "dubtool-build"
          New-Item -ItemType Directory -Force -Path $buildRoot | Out-Null
          "DUBTOOL_BUILD_ROOT=$buildRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packaging/requirements-lock.txt

      - name: Install FFmpeg
        shell: pwsh
        run: choco install ffmpeg --no-progress

      - name: Install locked dependencies (Python 3.13)
        if: matrix.python-version == '3.13'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/requirements-lock.txt
          python -m pip install --no-deps vieneu==3.8.5
          python -m pip install -e . --no-deps

      - name: Install from pyproject.toml (Python 3.11 compatibility)
        if: matrix.python-version != '3.13'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui,dev]"
          python -m pip install --no-deps "vieneu>=3.8,<4"

      - name: Preflight & README link gates
        shell: pwsh
        run: |
          python scripts/preflight_gates.py
          python scripts/check_readme_links.py --allow-missing-index

      - name: Run offline test suite
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest tests -m "not packaged" -q --timeout=120 -rs

      - name: Runtime self-test, layout check & GUI smoke
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m dubtool.app.main --selftest
          python -m dubtool.app.main --layout-check
          python -m dubtool.app.main --gui-smoke

  package:
    name: Windows · Python 3.13 · PyInstaller Verify
    runs-on: windows-latest
    needs: test
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure isolated build root & vendor assets
        shell: pwsh
        run: |
          $buildRoot = Join-Path $env:RUNNER_TEMP "dubtool-build"
          $vendorDir = Join-Path $buildRoot "vendor"
          $fontsDir  = Join-Path $vendorDir "fonts"
          New-Item -ItemType Directory -Force -Path $fontsDir | Out-Null
          "DUBTOOL_BUILD_ROOT=$buildRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: packaging/requirements-lock.txt

      - name: Install FFmpeg and populate vendor directory
        shell: pwsh
        run: |
          choco install ffmpeg --no-progress
          # Resolve the real Chocolatey ffmpeg.exe binary (not the 5 KB shim in bin/).
          $ffmpegPath = $null
          if (Test-Path "C:\ProgramData\chocolatey\lib\ffmpeg") {
            $ffmpegPath = Get-ChildItem "C:\ProgramData\chocolatey\lib\ffmpeg" -Recurse -Filter "ffmpeg.exe" |
              Sort-Object Length -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $ffmpegPath) { $ffmpegPath = (Get-Command ffmpeg).Source }
          Write-Host "Using real ffmpeg binary: $ffmpegPath ($((Get-Item $ffmpegPath).Length) bytes)"
          $vendorDir  = Join-Path $env:DUBTOOL_BUILD_ROOT "vendor"
          $fontsDir   = Join-Path $vendorDir "fonts"
          Copy-Item $ffmpegPath (Join-Path $vendorDir "ffmpeg.exe") -Force

          # Fetch the authentic SIL OFL-1.1 Noto Sans variable font and license
          # from the pinned google/fonts commit and verify SHA-256 (matching
          # packaging/THIRD_PARTY.md — never substitute a system font).
          $fontCommit = "2984c575fdce412ee02b2baaba67672b9a9434d8"
          $fontAssets = @(
            @{
              Url = "https://raw.githubusercontent.com/google/fonts/$fontCommit/ofl/notosans/NotoSans%5Bwdth,wght%5D.ttf"
              Dest = Join-Path $fontsDir "NotoSans.ttf"
              Sha256 = "bfb7bb691513f12e734dc346c03a03f784912432d7e3fa8e56efcf906fe86b3d"
            },
            @{
              Url = "https://raw.githubusercontent.com/google/fonts/$fontCommit/ofl/notosans/OFL.txt"
              Dest = Join-Path $fontsDir "OFL.txt"
              Sha256 = "cee9892f9f0cc8fe882c9e9537ee6a89621d86ee7ceaf70b02e2b2b1c25c061a"
            }
          )
          foreach ($asset in $fontAssets) {
            $ok = $false
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                Invoke-WebRequest -Uri $asset.Url -OutFile $asset.Dest -UseBasicParsing -TimeoutSec 60
                $ok = $true
                break
              } catch {
                Write-Warning "Attempt $attempt failed for $($asset.Url): $_"
                if ($attempt -lt 3) { Start-Sleep -Seconds (3 * $attempt) }
              }
            }
            if (-not $ok) { throw "Failed to download required font asset: $($asset.Url)" }
            $actual = (Get-FileHash -Path $asset.Dest -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $asset.Sha256) {
              throw "SHA-256 mismatch for $($asset.Dest): expected $($asset.Sha256), got $actual"
            }
            Write-Host "Verified $(Split-Path -Leaf $asset.Dest): $((Get-Item $asset.Dest).Length) bytes, sha256=$actual"
          }

      - name: Install locked build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/requirements-lock.txt
          python -m pip install --no-deps vieneu==3.8.5
          python -m pip install -e . --no-deps

      - name: Build DubTool.exe via PyInstaller
        shell: pwsh
        run: |
          $distDir = Join-Path $env:DUBTOOL_BUILD_ROOT "dist"
          $workDir = Join-Path $env:DUBTOOL_BUILD_ROOT "build"
          python -m PyInstaller packaging/dubtool.spec --noconfirm --distpath $distDir --workpath $workDir

          $appDir = Join-Path $distDir "DubTool"
          $exePath = Join-Path $appDir "DubTool.exe"
          $update = (Get-Content "packaging/update_number.txt" -Raw).Trim()
          $version = "1.0.$update"
          $git = $env:GITHUB_SHA
          $sha = (Get-FileHash $exePath -Algorithm SHA256).Hash.ToLower()
          $stamp = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd HH:mm:ss")
          $buildLines = @(
            "update: $update",
            "version: $version",
            "git: $git",
            "built (UTC): $stamp",
            "sha256: $sha",
            "build id: Update $update ($git)"
          )
          Set-Content -Path (Join-Path $appDir "BUILD_INFO.txt") -Value $buildLines -Encoding UTF8

      - name: Verify packaged DubTool.exe (--version, --selftest, --layout-check, --gui-smoke)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "
          import hashlib, os, subprocess, sys
          app_dir = os.path.join(os.environ['DUBTOOL_BUILD_ROOT'], 'dist', 'DubTool')
          exe = os.path.join(app_dir, 'DubTool.exe')
          assert os.path.isfile(exe), f'missing {exe}'
          font_path = os.path.join(app_dir, '_internal', 'vendor', 'fonts', 'NotoSans.ttf')
          ofl_path = os.path.join(app_dir, '_internal', 'vendor', 'fonts', 'OFL.txt')
          assert os.path.isfile(font_path), f'missing bundled {font_path}'
          assert os.path.isfile(ofl_path), f'missing bundled {ofl_path}'
          font_sha = hashlib.sha256(open(font_path, 'rb').read()).hexdigest()
          expected_font_sha = 'bfb7bb691513f12e734dc346c03a03f784912432d7e3fa8e56efcf906fe86b3d'
          assert font_sha == expected_font_sha, f'bundled NotoSans.ttf sha256 mismatch: {font_sha}'
          print(f'Verified bundled NotoSans.ttf ({os.path.getsize(font_path)} bytes, sha256={font_sha})', flush=True)
          for flag in ('--version', '--selftest', '--layout-check', '--gui-smoke'):
              print(f'=== {exe} {flag} ===', flush=True)
              r = subprocess.run([exe, flag], capture_output=True, text=True, timeout=180)
              if r.stdout: print(r.stdout, flush=True)
              if r.stderr: print(r.stderr, file=sys.stderr, flush=True)
              if r.returncode != 0:
                  sys.exit(r.returncode)
          "

      - name: Verify packaged screenshots (DubTool.exe --screenshots & test_screenshots.py)
        shell: pwsh
        run: |
          python -c "
          import os, subprocess, sys
          build_root = os.environ['DUBTOOL_BUILD_ROOT']
          exe = os.path.join(build_root, 'dist', 'DubTool', 'DubTool.exe')
          shot_dir = os.path.join(build_root, 'screenshots', 'ci_' + os.environ['GITHUB_SHA'][:12])
          os.makedirs(shot_dir, exist_ok=True)
          env = {k: v for k, v in os.environ.items() if k != 'QT_QPA_PLATFORM'}
          print(f'=== {exe} --screenshots {shot_dir} ===', flush=True)
          r = subprocess.run([exe, '--screenshots', shot_dir], env=env, capture_output=True, text=True, timeout=180)
          if r.stdout: print(r.stdout, flush=True)
          if r.stderr: print(r.stderr, file=sys.stderr, flush=True)
          if r.returncode != 0:
              sys.exit(r.returncode)
          "
          python -m pytest tests -m packaged -v --timeout=120

      - name: Upload packaged screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: packaged-screenshots-diagnostic
          path: ${{ env.DUBTOOL_BUILD_ROOT }}\screenshots
          if-no-files-found: ignore
