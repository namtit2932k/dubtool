name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-ci:
    name: Windows (Python 3.13)
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      DUBTOOL_BUILD_ROOT: ${{ runner.temp }}\dubtool-build
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install FFmpeg
        shell: pwsh
        run: choco install ffmpeg --no-progress

      - name: Install DubTool from source (CLI + GUI + dev + VieNeu)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui,dev]"
          python -m pip install --no-deps "vieneu>=3.8,<4"

      - name: Preflight & README link gates
        shell: pwsh
        run: |
          python scripts/preflight_gates.py
          python scripts/check_readme_links.py

      - name: Run offline test suite
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest tests --ignore=tests/test_screenshots.py -q --timeout=120 -rs

      - name: Runtime self-test, layout check & GUI smoke
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m dubtool.app.main --selftest
          python -m dubtool.app.main --layout-check
          python -m dubtool.app.main --gui-smoke
