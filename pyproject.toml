[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dubtool"
description = "English -> Vietnamese video dubbing tool"
requires-python = ">=3.11"
# AGU9 5.2: single version source (dubtool.__version__, 1.0.<update>).
dynamic = ["version"]
dependencies = [
  "faster-whisper>=1.0",
  "av>=11,<19",  # AGU8 7.1: PyAV 19+ changes the APIs faster-whisper uses
  "anthropic>=0.40",
  "edge-tts>=6.1",
  "pydub>=0.25",
  "python-docx>=1.1",  # AGU7 task 4: the customer-readable translation file
  "python-dotenv>=1.0",
  "google-genai>=2.33.0,<3",  # pinned close-range: HttpOptions.timeout is int ms (AGU7 4.1)
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dubtool = "dubtool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "dubtool.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
