[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dubtool"
version = "0.1.0"
description = "English -> Vietnamese video dubbing tool"
requires-python = ">=3.11"
dependencies = [
  "faster-whisper>=1.0",
  "anthropic>=0.40",
  "edge-tts>=6.1",
  "pydub>=0.25",
  "python-dotenv>=1.0",
  "google-genai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dubtool = "dubtool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
