# Model catalog, shipped in the exe and user-extendable (add an entry with
# the same keys; the loader is tolerant of extra keys and of entries being
# plain scalar maps). `paid` only tells the UI to ask before the first paid
# run — no price is stored anywhere. `structured`: json_schema (answer shape
# guaranteed by the provider) | json_object (JSON-only prompt) | none.
# `reasoning`: the model spends tokens reasoning before answering (no
# temperature/top_p sent, larger output budget). Defaults come with the
# entry: translate_concurrency, request_timeout_s, chunk_max_chars,
# max_output_tokens. NO PRICES HERE.
gemini-3.5-flash-lite:
  provider: gemini
  label: Gemini 3.5 Flash-Lite
  paid: false
  structured: json_schema
  reasoning: false
  translate_concurrency: 3
  request_timeout_s: 90
  chunk_max_chars: 1200
  max_output_tokens: 8000
  verified: ai.google.dev/gemini-api/docs/models (2026-10-26)
